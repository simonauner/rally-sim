<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rally</title>
    <!-- Förhandsvisning när länken delas (Slack, Facebook, Threads m.fl.); bilden måste ha absolut adress. -->
    <meta name="description" content="Rallysimulator i webbläsaren. Kör verkliga svenska grus- och isvägar med realistisk fysik, gör karriär, köp bilar och vinn mästerskap. Gratis, ingen installation." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rally" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:url" content="https://www.auner.se/rally-sim/" />
    <meta property="og:title" content="Rally i webben på svenska vägar" />
    <meta property="og:description" content="Kör verkliga svenska grus- och isvägar med realistisk fysik. Gör karriär, köp bilar och vinn mästerskap. Gratis, direkt i webbläsaren." />
    <meta property="og:image" content="https://www.auner.se/rally-sim/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Röd rallybil på en grusväg genom tallskog" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd8dc; font-family: ui-monospace, Menlo, Consolas, monospace; }
      canvas#view { display: block; width: 100vw; height: 100vh; }
      #hud { position: fixed; left: 12px; bottom: 12px; color: #1b1b1b; font-size: 13px; line-height: 1.35; pointer-events: none; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
      #hud .big { font-size: 34px; font-weight: 700; }
      #gauges { position: fixed; left: 12px; top: 200px; width: 240px; height: 435px; pointer-events: none; }
      #wheels { margin-top: 6px; border-collapse: collapse; }
      #wheels td, #wheels th { padding: 1px 6px 1px 0; text-align: right; font-weight: 400; }
      #help { position: fixed; left: 12px; top: 12px; max-width: 640px; font-size: 12px; color: #1b1b1b; background: #fffb; padding: 8px 10px; border-radius: 8px; line-height: 1.5; pointer-events: none; }
      #gg { position: fixed; right: 12px; bottom: 12px; width: 140px; height: 140px; background: #fff8; border-radius: 8px; pointer-events: none; }
      #unsupported { display: none; position: fixed; inset: 0; z-index: 2002; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 18px; background: #eceff1; }
      /* Klockan uppe till höger, i samma stil som noterna: vit text med svart kant. */
      #timer { position: fixed; right: 16px; top: 12px; text-align: right; color: #fff; font-size: 16px; font-weight: 700; line-height: 1.35; font-variant-numeric: tabular-nums; pointer-events: none; -webkit-text-stroke: 4px #000; paint-order: stroke fill; text-shadow: 0 2px 4px #000a; }
      #timer:empty { display: none; }
      #timer .clock { font-size: 44px; -webkit-text-stroke-width: 6px; }
      #timer .field { margin-top: 8px; font-size: 14px; -webkit-text-stroke-width: 3px; }
      #timer .field .me { color: #ffd000; }
      #timer .ahead { color: #4caf50; }
      #timer .behind { color: #ff3b30; }
      .ahead { color: #2e7d32; }
      .behind { color: #c62828; }
      #notes { position: fixed; left: 50%; top: 20vh; transform: translateX(-50%); text-align: center; color: #fff; font-size: 30px; font-weight: 700; line-height: 1.3; pointer-events: none; -webkit-text-stroke: 6px #000; paint-order: stroke fill; text-shadow: 0 2px 4px #000a; }
      #notes .now { font-size: 54px; }
      #notes .hint { font-size: 12px; font-weight: 400; opacity: 0.8; -webkit-text-stroke-width: 2px; }
      /* Kurvans grad: 1 = skarpast (röd), 6 = nästan rak (grön). */
      #notes .g1 { color: #ff3b30; } #notes .g2 { color: #ff8a00; } #notes .g3 { color: #ffd000; }
      #notes .g4 { color: #d4e157; } #notes .g5 { color: #8bc34a; } #notes .g6 { color: #4caf50; }
      #notes .icon { display: inline-block; min-width: 1.2em; }
      #menu { display: none; position: fixed; inset: 0; z-index: 2000; align-items: center; justify-content: center; background: #1b1b2499; }
      #menu.solid { background: linear-gradient(160deg, #cfe3ee, #a9c3a0); }
      /* Huvudmenyn visar kurvan med bilarna (menuScene.ts) bakom sig. */
      body.menu-scene #menu.solid { background: none; }
      /* Ovanför #menu (z-index 2000). */
      #menu-cars-mute { position: fixed; left: 12px; top: 12px; z-index: 2001; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; color: #1b1b1b; border: none; border-radius: 50%; background: #fffc; box-shadow: 0 2px 8px #0003; cursor: pointer; }
      #menu-cars-mute[hidden] { display: none; }
      /* Hudens rutor är tomma tills spelet startat; annars syns tomma vita rutor över menyscenen. */
      :is(#help, #damage):empty { display: none; }
      #menu .panel { max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; min-width: 320px; max-width: min(560px, calc(100vw - 32px)); background: #fffe; border-radius: 12px; padding: 24px 28px; box-shadow: 0 8px 32px #0003; color: #1b1b1b; }
      #menu h1 { margin: 0; font-size: 34px; letter-spacing: 0.08em; }
      #menu .subtitle { margin-top: 2px; opacity: 0.7; font-size: 13px; }
      #menu .body { margin-top: 14px; font-size: 13px; line-height: 1.7; }
      #menu .items { margin-top: 18px; display: flex; flex-direction: column; gap: 6px; }
      #menu button { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font: inherit; font-size: 17px; text-align: left; padding: 10px 14px; border: 2px solid transparent; border-radius: 8px; background: #0000000d; color: inherit; cursor: pointer; }
      #menu button.selected { border-color: #1b1b1b; background: #fff; }
      /* Rad som vänts för att bekräftas (MenuItem.confirm): vänds runt sin vågräta axel. */
      #menu button.flipped { align-items: center; background: #1b1b1b; color: #fff; border-color: #1b1b1b; animation: flip 0.22s ease-out; }
      #menu button.unflip { animation: flip 0.22s ease-out; }
      @keyframes flip { from { transform: perspective(600px) rotateX(-90deg); } }
      /* Låst val: raden skakar på huvudet. */
      #menu button.shake { animation: shake 0.45s ease-in-out; }
      @keyframes shake { 15% { transform: translateX(-7px); } 35% { transform: translateX(6px); } 55% { transform: translateX(-4px); } 75% { transform: translateX(2px); } }
      #menu button.flipped .choices { display: flex; gap: 6px; }
      #menu button.flipped .choices b { padding: 2px 12px; border: 2px solid #fff6; border-radius: 6px; font-weight: 600; }
      #menu button.flipped .choices b.on { background: #fff; color: #1b1b1b; border-color: #fff; }
      #menu button.pic { justify-content: flex-start; align-items: center; min-width: min(500px, calc(100vw - 88px)); box-sizing: border-box; padding: 8px 14px 8px 8px; }
      #menu button.pic .thumb { flex: none; width: 48%; align-self: stretch; min-height: 120px; border-radius: 6px; background: var(--img) center / cover; }
      #menu button.pic .note { margin-top: 6px; font-size: 13px; line-height: 1.6; }
      #menu button.pic .note span { display: block; }
      #menu button.pic .note b { display: block; margin-top: 4px; }
      #menu .banner { display: block; width: 100%; aspect-ratio: 3.2; object-fit: cover; margin-bottom: 12px; border-radius: 8px; }
      #menu .result { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
      /* Panelen står 12vh ner, men glider upp till tidtagarens höjd (12px) när den inte får plats: luften ovanför krymper först. */
      #menu.side { flex-direction: column; justify-content: flex-start; align-items: stretch; overflow-y: auto; padding: 12px max(16px, 4vw) 16px; box-sizing: border-box; background: none; }
      #menu.side::before { content: ''; flex: 0 1 calc(12vh - 12px); }
      #menu.side .panels { flex: none; display: flex; justify-content: flex-end; align-items: flex-start; flex-wrap: wrap; gap: 16px; }
      /* Fast bredd så panelen inte hoppar när innehållet byts; höjden animeras i carSelect.ts. */
      /* Scrollar när innehållet inte heller får plats från tidtagarens höjd. */
      #menu.side .panel { width: 460px; box-sizing: border-box; max-height: calc(100vh - 28px); overflow: hidden auto; }
      /* Två lika höga paneler bredvid varandra, under varandra på smala skärmar. */
      #menu.pair { flex-wrap: wrap; align-content: safe center; padding: 16px 0; box-sizing: border-box; align-items: stretch; gap: 16px; overflow-y: auto; }
      #menu.pair .panel { width: 460px; max-height: none; }
      #menu .recovery { margin: 12px 0; font-size: 18px; font-weight: 700; letter-spacing: 0.04em; word-break: break-all; user-select: all; }
      #menu input { display: block; width: 100%; box-sizing: border-box; margin-top: 14px; padding: 10px 12px; font: inherit; font-size: 15px; border: 2px solid #1b1b1b33; border-radius: 8px; text-transform: uppercase; }
      #menu .loading { margin-top: 16px; display: flex; align-items: center; gap: 10px; font-size: 15px; }
      #menu .spinner { width: 18px; height: 18px; border: 3px solid #1b1b1b33; border-top-color: #1b1b1b; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #menu .specs { margin-top: 10px; border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      #menu .specs th { text-align: left; font-weight: 600; padding: 3px 14px 3px 0; white-space: nowrap; vertical-align: top; }
      #menu .specs td { padding: 3px 0; }
      #menu .car-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 20px; }
      #menu .car-nav b { flex: 1; text-align: center; }
      #menu .car-nav small { font-size: 12px; opacity: 0.6; }
      #menu .car-extra { margin: -4px 0 8px; font-size: 12px; opacity: 0.6; text-align: center; }
      #menu .car-nav span { padding: 2px 12px; border-radius: 8px; background: #0000000d; cursor: pointer; user-select: none; }
      #menu .trophy { display: inline-block; width: 20px; height: 20px; margin-right: 6px; vertical-align: middle; text-align: right; font-size: 13px; line-height: 20px; }
      #menu .trophies { margin-bottom: 10px; }
      #menu .trophies .trophy { width: 30px; height: 30px; margin-right: 4px; }
      #menu .trophy[role] { filter: drop-shadow(0 1px 1px #0004); }
      /* Placering på etappen; guld, silver och brons glänser som pokalerna. */
      #menu .pos { display: inline-block; width: 18px; height: 18px; margin-left: 8px; border-radius: 50%; text-align: center; font-size: 10px; font-weight: 700; line-height: 18px; vertical-align: 1px; color: #1b1b1bb0; background: #0000000f; box-shadow: inset 0 0 0 1px #0000001a; }
      #menu th .pos { margin: 0 8px 0 0; }
      #menu .pos.p1 { color: #5a4100; background: radial-gradient(circle at 35% 30%, #fff6b0, #f2c200 55%, #a87b00); }
      #menu .pos.p2 { color: #3d434b; background: radial-gradient(circle at 35% 30%, #fff, #c9ced6 55%, #7d848f); }
      #menu .pos.p3 { color: #4a2a0f; background: radial-gradient(circle at 35% 30%, #ffd9b0, #d4884a 55%, #8a4f1f); }
      #menu .prize { margin-top: 10px; font-size: 18px; font-weight: 700; }
      #menu .hint { margin-top: 8px; opacity: 0.6; font-size: 12px; }
      #menu .corner { position: fixed; right: 12px; bottom: 8px; font-size: 11px; opacity: 0.45; }
      #menu button small { font-size: 12px; opacity: 0.7; }
      #menu button.locked { color: #1b1b1b80; }
      #menu button.pic.locked .thumb { filter: grayscale(1) brightness(0.7); }
      #menu .lock { width: 0.9em; height: 0.9em; margin-left: 8px; vertical-align: -0.1em; }
      #menu button .note { display: block; margin-top: 2px; font-size: 12px; opacity: 0.7; }
      /* Felsökningsverktygen visas bara med F1. */
      body:not(.debug) :is(#hud, #gg, .lil-gui.lil-root) { display: none; }
      /* Slutresultatet i mästerskapet: bara bilen och resultatpanelen. */
      body.final-results :is(#hud, #help, #gg, #gauges, #damage, #timer, #notes) { display: none; }
      #damage { position: fixed; left: 12px; top: 112px; color: #1b1b1b; font-size: 12px; background: #fffb; padding: 8px 10px; border-radius: 8px; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="help"></div>
    <canvas id="gg" width="280" height="280"></canvas>
    <canvas id="gauges" width="480" height="870"></canvas>
    <div id="damage"></div>
    <div id="timer"></div>
    <div id="notes"></div>
    <!-- Syns direkt medan skripten laddas; ersätts av första menyn (menu.ts). -->
    <div id="menu" class="solid" style="display: flex"><div class="panel"><h1>RALLY</h1><div class="loading"><span class="spinner"></span>Laddar…</div></div></div>
    <div id="unsupported">
      <div>Det här spelet kräver WebGPU.<br />Uppdatera till Chrome/Edge, Firefox 141+ eller Safari 26.</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
