name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:physics
      - run: npm run test:account
      - run: npm ci --prefix sync
      - run: npm run types --prefix sync
      - run: npm run typecheck --prefix sync

      - run: npm run build
        env:
          # The sync server's address. Without it the account exists only locally in the browser.
          VITE_SYNC_URL: ${{ vars.SYNC_URL }}

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The sync server (sync/). Deployed on every push, so that its settings, such as which
  # origins it accepts, never lag behind the game.
  deploy-sync:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sync/package-lock.json

      # The worker bundles the shared game code in src/ (the weekly challenge's run check), which imports three.
      - run: npm ci
      - run: npm ci --prefix sync
      - run: npm run deploy --prefix sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
